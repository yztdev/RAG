spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

admin:
  bootstrap:
    enabled: false

app:
  auth:
    registration:
      mode: ${APP_AUTH_REGISTRATION_MODE:OPEN}
      invite-required: ${APP_AUTH_INVITE_REQUIRED:false}

elasticsearch:
  insecure-trust-all-certificates: false

security:
  allowed-origins: ${SECURITY_ALLOWED_ORIGINS}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.boot.autoconfigure.web.servlet: INFO
    org.springframework.security: INFO
    com.yizhaoqi.smartpai: INFO
    io.minio: WARN
